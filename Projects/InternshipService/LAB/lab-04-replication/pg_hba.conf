# Лабораторная №4: pg_hba.conf для Primary.
# Разрешаем replication-подключения от Replica (контейнер postgres-replica)
# под пользователем replicator, а также обычные подключения.
local   all             all                                     trust
local   replication     all                                     trust
host    replication     replicator      0.0.0.0/0               scram-sha-256
host    replication     all             0.0.0.0/0               scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
